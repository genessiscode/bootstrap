name: Deploy Bootstrap to GitHub

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Git
        run: |
          git config user.name "genessiscode"
          git config user.email "noreply@github.com"
      - name: Push to bootstrap repo
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git remote add bootstrap https://x-access-token:${GITHUB_TOKEN}@github.com/genessiscode/bootstrap.git 2>/dev/null || true
          git push bootstrap main
