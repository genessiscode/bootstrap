name: Deploy Static Content to Pages

on:
  push:
    branches: ["main"] # Triggers the workflow every time you push to the main branch

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        
      - name: Copy index.html to Root
        run: cp pages/index.html .

      # 🆕 AUTOMATED STEP: Automatically rewrite ../ paths to ./ so styling works
      - name: Fix Asset Paths for Root Context
        run: |
          sed -i 's|href="../|href="./|g' index.html
          sed -i 's|src="../|src="./|g' index.html

      # 🆕 AUTOMATED STEP: Make sure navbar links back into the pages subfolder still work
      - name: Fix Subpage Navigation Links
        run: |
          sed -i 's|href="\(index.html\)"|href="./pages/\1"|g' index.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Keep this as '.' to upload root assets (css, scripts, and the newly copied index.html)
          path: '.' 

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
